<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/zawadi/tarts/strawberry-thumb.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zawadi Cakes — Handmade tortes in Nairobi</title>
    <meta name="description" content="Zawadi Cakes: handmade fruit and chocolate tortes, baked fresh in Nairobi. Choose your flavour and order online." />
    <meta name="theme-color" content="#c21f3a" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Zawadi Cakes — Handmade tortes in Nairobi" />
    <meta property="og:description" content="Handmade fruit and chocolate tortes, baked fresh in Nairobi." />
    <meta property="og:image" content="/zawadi/tarts/strawberry.webp" />
    <!-- fonts are self-hosted (latin subset, only the weights in use) so they come
         from the same server as the page instead of two extra Google connections.
         Poppins is all the hero needs, so it is preloaded; Playfair loads when used. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-500.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-600.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-700.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-800.woff2" crossorigin />
    <style>
      @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/poppins-400.woff2) format('woff2'); }
      @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 500; font-display: swap; src: url(/fonts/poppins-500.woff2) format('woff2'); }
      @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 600; font-display: swap; src: url(/fonts/poppins-600.woff2) format('woff2'); }
      @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 700; font-display: swap; src: url(/fonts/poppins-700.woff2) format('woff2'); }
      @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 800; font-display: swap; src: url(/fonts/poppins-800.woff2) format('woff2'); }
      @font-face { font-family: 'Playfair Display'; font-style: normal; font-weight: 500 700; font-display: swap; src: url(/fonts/playfair.woff2) format('woff2'); }
      @font-face { font-family: 'Playfair Display'; font-style: italic; font-weight: 500; font-display: swap; src: url(/fonts/playfair-italic.woff2) format('woff2'); }
    </style>
    <!-- the first cake in the hero: phones get the 640px copy, larger screens the full one -->
    <link
      rel="preload"
      as="image"
      href="/zawadi/tarts/strawberry.webp"
      imagesrcset="/zawadi/tarts/strawberry-640.webp 640w, /zawadi/tarts/strawberry.webp 1024w"
      imagesizes="(max-width: 899px) 80vw, min(46vw, 80vh)"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
